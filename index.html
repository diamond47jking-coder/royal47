      reportMusicError(error);
    }
  }
  function pauseMusic(){
    music.pause();
    music.dataset.state = musicLoaded ? 'paused' : 'waiting';
  }
  music.addEventListener('playing',()=>{
    if(!soundOn || document.hidden) { pauseMusic(); return; }
    musicHasPlayed = true;
    music.dataset.state = 'playing';
  });
  music.addEventListener('ended',()=>{
    musicFinished = !music.loop;
    music.dataset.state = 'ended';
  });
  music.addEventListener('error',()=>{
    musicPlayPending = false;
    reportMusicError(music.error);
  });
  function beginSoundFromAction(){
    if(raw.MUSIC_START_ON_ACTION === true && !soundWasChosen){
      soundWasChosen = true;
      soundOn = true;
      updateSoundUI();
    }
    startMusic();
    audioContext();
  }
  function suspendPageSound(){
    musicResumeAfterHidden = soundOn && musicHasPlayed && !music.paused && !musicFinished;
    pauseMusic();
    stopRattle();
    if(audio) audio.suspend().catch(()=>{});
  }
  function resumePageSound(){
    if(musicResumeAfterHidden && soundOn && !document.hidden) startMusic();
    musicResumeAfterHidden = false;
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) suspendPageSound();
    else resumePageSound();
  });
  window.addEventListener('pagehide',()=>{
    // visibilitychange may already have recorded the resume state.
    if(!document.hidden) suspendPageSound();
    else { pauseMusic(); stopRattle(); if(audio) audio.suspend().catch(()=>{}); }
  });
  window.addEventListener('pageshow',event=>{
    if(event.persisted && !document.hidden) resumePageSound();
  });
  function audioContext(){
    if(!soundOn || document.hidden || raw.SOUND_EFFECTS_ENABLED === false)return null;
    try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audio=new A();}if(audio.state==='suspended')audio.resume().catch(()=>{});return audio;}catch(_){return null;}
  }
  function tone(frequency,start=0,duration=.3,volume=.045){
    const a=audioContext();if(!a)return;
    const osc=a.createOscillator(),g=a.createGain(),t=a.currentTime+start;
    osc.type='sine';osc.frequency.setValueAtTime(frequency,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume* 6,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(g);g.connect(a.destination);osc.start(t);osc.stop(t+duration+.03);
  }
  function rattle(){
    const a=audioContext();if(!a)return;
    try{if(!noiseBuffer){noiseBuffer=a.createBuffer(1,Math.ceil(a.sampleRate*.035),a.sampleRate);const ch=noiseBuffer.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.exp(-i/ch.length*6);}
    const src=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();src.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=1350+Math.random()*900;filter.Q.value=.8;gain.gain.value=.80;src.connect(filter);filter.connect(gain);gain.connect(a.destination);src.start();}catch(_){}
  }
  function stopRattle(){if(rattleTimer!==null){clearInterval(rattleTimer);rattleTimer=null;}}
  el('soundButton').addEventListener('click',()=>{
    soundWasChosen = true;
    soundOn = !soundOn;
    updateSoundUI();
    if(soundOn){
      // Toggling back on also retries a failed file load or a completed track.
      musicFinished = false;
      if(music.error && musicLoaded){music.load();}
      if(music.ended){try{music.currentTime = 0;}catch(_){}}
      startMusic();
      audioContext();
      tone(659,0,.13,.025);
      if(phase === 'shaking' && rattleTimer === null){rattle();rattleTimer=setInterval(rattle,145);}
    }else{
      musicResumeAfterHidden = false;
      pauseMusic();
      stopRattle();
      if(audio) audio.suspend().catch(()=>{});
    }
  });
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function onMain(){
    if(busyPhases.includes(phase))return;
    beginSoundFromAction();
    if(phase==='result'){claim();return;}
    const run=++token;
    if(phase==='intro'){
      setPhase('opening');tone(523,0,.26);tone(783,.1,.4,.027);
      await wait(motionQuery.matches?40:900);if(run!==token)return;
      setPhase('ready');announce(tr('readyHint'));return;
    }
    if(phase!=='ready')return;
    try{
      setPhase('shaking');announce(tr('busyHint'));
      if(soundOn){rattle();rattleTimer=setInterval(rattle,145);}
      await wait(motionQuery.matches?350:cfg.shakeDuration);stopRattle();if(run!==token)return;
      setPhase('selecting');tone(659,0,.4,.025);tone(987,.16,.6,.035);
      await wait(motionQuery.matches?50:900);if(run!==token)return;
      setPhase('revealing');particles.burst();tone(523,0,.8,.035);tone(659,.09,.9,.035);tone(783,.18,1,.033);tone(1046,.3,1.2,.027);
      await wait(motionQuery.matches?70:950);if(run!==token)return;
      setPhase('result');save();announce(tr(fixed?'fixedStatus':'resultStatus'));el('prizeTitle').focus({preventScroll:true});
    } catch(error){stopRattle();setPhase('ready');console.error('Experience reset after an animation error.',error);}
  }
  mainAction.addEventListener('click',onMain);cupButton.addEventListener('click',onMain);
  el('replayButton').addEventListener('click',()=>{if(busyPhases.includes(phase))return;++token;stopRattle();clearSaved();particles.clearBurst();setPhase('intro');mainAction.focus({preventScroll:true});});
  function closeModal(){
    if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');
    modalNext=null;
    if(returnFocus&&typeof returnFocus.focus==='function')returnFocus.focus({preventScroll:true});
  }
  function showModal({title,body,extra='',code=false,destination='',next=null}){
    returnFocus=document.activeElement;modalNext=next;
    text(el('dialogTitle'),title);text(el('dialogBody'),body);text(el('dialogBodyExtra'),extra);
    el('dialogBodyExtra').hidden=!extra;el('dialogCode').hidden=!code;
    el('dialogDestination').hidden=!destination;el('dialogDestination').textContent=destination;
    el('dialogAction').textContent=tr(next?'continue':'back');
    if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
    el('dialogAction').focus();
  }
  el('dialogClose').addEventListener('click',closeModal);
  el('dialogAction').addEventListener('click',()=>{const next=modalNext;closeModal();if(next)next();});
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  dialog.addEventListener('cancel',()=>{modalNext=null;});
  el('termsButton').addEventListener('click',()=>showModal({title:tr('termsTitle'),body:fixed?cfg.terms[lang]:tr('demoTerms'),extra:fixed?tr('fixedTermsExtra'):(configurationFallback?tr('fallback'):'')}));
  function destination(){
    if(!cfg.destination)return null;
    const u=new URL(cfg.destination);
    if(u.protocol!=='https:'||u.username||u.password)throw new Error('Invalid destination');
    if(cfg.passUTM){const source=new URLSearchParams(location.search);for(const k of ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id'])if(source.has(k)&&!u.searchParams.has(k))u.searchParams.set(k,(source.get(k)||'').slice(0,250));}
    return u;
  }
  // ClaimClick 只表示揭晓后点击领取入口，不表示已领奖、注册或付款。
  // 同一次跳转期间防止连续点击重复发送；浏览器返回页面后允许再次使用。
  let claimNavigationPending = false;
  window.addEventListener('pageshow', () => { claimNavigationPending = false; });
  function claim(){
    if (claimNavigationPending || phase !== 'result') return;
    let url;

    // 保留原来的链接校验。无有效链接时不发送领取点击事件。
    try {
      url = destination();
    } catch (_) {
      showModal({ title: tr('badLinkTitle'), body: tr('badLink'), code: true });
      return;
    }
    if (!url) {
      showModal({ title: tr('fixedNoLinkTitle'), body: tr('noLink'), code: true });
      return;
    }

    claimNavigationPending = true;
    const navigate = () => {
      try {
        location.assign(url.href);
      } catch (error) {
        claimNavigationPending = false;
        console.warn('Unable to open the configured destination.', error);
      }
    };

    // 不添加金额、账号或其他客户资料；沿用已有 Pixel 和同意设置。
    if (typeof window.fbq === 'function') {
      try {
        window.fbq('trackCustom', 'ClaimClick');
        // 给异步请求一个短暂发送窗口；不是 Meta 接收确认，也不保证必达。
        // 不显示确认弹窗，300 毫秒后仍自动前往原本的链接。
        window.setTimeout(navigate, 300);
        return;
      } catch (error) {
        console.warn('ClaimClick tracking could not start; continuing navigation.', error);
      }
    }
    // Pixel 被阻止或不可用时，正常跳转，不影响顾客使用网页。
    navigate();
  }
  // One canvas, capped pixel density, no network assets or animation libraries.
  const particles=(()=>{
    const canvas=el('particles');const ctx=canvas.getContext('2d');
    if(!ctx)return{burst(){},clearBurst(){}};
    const dpr=Math.min(window.devicePixelRatio||1,1.5);canvas.width=480*dpr;canvas.height=900*dpr;ctx.scale(dpr,dpr);
    let specks=Array.from({length:34},()=>({x:Math.random()*480,y:Math.random()*900,r:Math.random()*1.25+.35,s:Math.random()*.35+.13,a:Math.random()*.46+.13,t:Math.random()*7}));
    let petals=Array.from({length:7},()=>({x:Math.random()*480,y:Math.random()*900,r:Math.random()*3+2,s:Math.random()*.28+.17,t:Math.random()*7}));
    let sparks=[];let last=0;let clock=0;let request=0;
    function frame(time){
      request=requestAnimationFrame(frame);
      if(document.hidden||motionQuery.matches){last=time;return;}
      if(time-last<30)return;
      const delta=Math.min((time-last)/16.667,2.6)||1;last=time;clock+=delta*.012;
      ctx.clearRect(0,0,480,900);
      for(const p of specks){p.y-=p.s*delta;p.x+=Math.sin(clock+p.t)*.07*delta;if(p.y<-5){p.y=905;p.x=Math.random()*480;}
        ctx.globalAlpha=p.a*(.7+.3*Math.sin(clock*2+p.t));ctx.fillStyle='#ffe3a5';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
      for(const p of petals){p.y+=p.s*delta;p.x+=Math.sin(clock*.5+p.t)*.21*delta;if(p.y>910){p.y=-10;p.x=Math.random()*480;}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(clock*.25+p.t);ctx.globalAlpha=.22;ctx.fillStyle='#e9a282';ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.48,0,0,Math.PI*2);ctx.fill();ctx.restore();}
      for(const p of sparks){p.life-=delta;p.vy+=.028*delta;p.x+=p.vx*delta;p.y+=p.vy*delta;if(p.life<=0)continue;ctx.globalAlpha=Math.min(1,p.life/25)*p.alpha;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+=.03*delta);if(p.star){ctx.fillRect(-p.size*2,-.5,p.size*4,1);ctx.fillRect(-.5,-p.size*2,1,p.size*4);}else{ctx.fillRect(-p.size/2,-p.size,p.size,p.size*2);}ctx.restore();}
      sparks=sparks.filter(p=>p.life>0);ctx.globalAlpha=1;
    }
    request=requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(request);request=0;stopRattle();}else{last=0;request=requestAnimationFrame(frame);}});
    return {burst(){if(motionQuery.matches)return;sparks=Array.from({length:85},(_,i)=>{const a=Math.random()*Math.PI*2,s=Math.random()*3.8+1;return{x:240+(Math.random()-.5)*40,y:518+(Math.random()-.5)*30,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.6,life:Math.random()*80+55,alpha:Math.random()*.6+.3,size:Math.random()*2.3+1,rot:a,color:['#ffe7a4','#e8bf77','#e8c294'][i%3],star:i%4===0};});},clearBurst(){sparks=[];ctx.clearRect(0,0,480,900);}};
  })();
  setLanguage(lang);
  if(wasSaved()){setPhase('result');announce(tr('restored'));}
  if(configurationFallback)console.warn('Fixed-offer terms are incomplete. The page is safely using demo mode.');
})();
</script>
